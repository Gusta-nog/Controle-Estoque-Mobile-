<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>Estoque Mobile</ion-list-header>
          <ion-note>Sistema de Gestão</ion-note>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerDirection="root" routerLink="/dashboard" lines="none" detail="false" routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" name="grid"></ion-icon>
              <ion-label>Dashboard</ion-label>
            </ion-item>

            <ion-item routerDirection="root" routerLink="/users" lines="none" detail="false" routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" name="person"></ion-icon>
              <ion-label>Usuários</ion-label>
            </ion-item>

            <ion-item routerDirection="root" routerLink="/clients" lines="none" detail="false" routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" name="people"></ion-icon>
              <ion-label>Clientes</ion-label>
            </ion-item>

            <ion-item routerDirection="root" routerLink="/products" lines="none" detail="false" routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" name="cube"></ion-icon>
              <ion-label>Produtos</ion-label>
            </ion-item>

            <ion-item routerDirection="root" routerLink="/sales" lines="none" detail="false" routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" name="cart"></ion-icon>
              <ion-label>Vendas</ion-label>
            </ion-item>

            <ion-item routerDirection="root" routerLink="/receivables" lines="none" detail="false" routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" name="cash"></ion-icon>
              <ion-label>Recebimentos</ion-label>
            </ion-item>

            <ion-item routerDirection="root" routerLink="/reports" lines="none" detail="false" routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" name="pie-chart"></ion-icon>
              <ion-label>Relatórios</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <ion-list id="labels-list">
          <ion-list-header>Sistema</ion-list-header>
          <ion-item lines="none" (click)="logout()" button>
            <ion-icon aria-hidden="true" slot="start" name="log-out" color="danger"></ion-icon>
            <ion-label color="danger">Sair</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
