<ion-content class="ion-padding" color="light">
  <div class="login-container">
    <div class="login-logo">
      <ion-icon name="cube" color="primary"></ion-icon>
      <h2>Estoque Mobile</h2>
    </div>

    <ion-card class="login-card">
      <ion-card-header>
        <ion-card-title class="ion-text-center">Acesso ao Sistema</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-item lines="full" class="ion-margin-bottom">
          <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
          <ion-input label="Usuário" labelPlacement="floating" [(ngModel)]="username" type="text" placeholder="Digite seu usuário"></ion-input>
        </ion-item>

        <ion-item lines="full" class="ion-margin-bottom">
          <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
          <ion-input label="Senha" labelPlacement="floating" [(ngModel)]="password" type="password" (keyup.enter)="login()" placeholder="Digite sua senha"></ion-input>
        </ion-item>

        <ion-button expand="block" class="ion-margin-top" (click)="login()">
          Entrar
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>

  <ion-toast
    [isOpen]="isToastOpen"
    [message]="toastMessage"
    duration="3000"
    (didDismiss)="isToastOpen = false"
    color="danger"
    position="bottom">
  </ion-toast>
</ion-content>
